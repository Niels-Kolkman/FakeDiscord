name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer lint

  larastan:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer analyse -- --no-progress --error-format=github

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd resizes uploaded avatars and generates the fake images used in tests.
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The welcome page only emits @vite tags when public/build/manifest.json exists.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Same two commands as `composer test`, plus a JUnit log for the step below.
      - name: Run tests
        run: |
          php artisan config:clear --ansi
          php artisan test --log-junit=junit.xml

      # Only on failure: show each failing test as an annotation on the run page,
      # so the errors are visible without opening the raw job log.
      - name: Annotate failing tests
        if: failure()
        run: php .github/scripts/annotate-junit.php junit.xml

  coverage:
    name: Coverage (app/ at least 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml's <source> limits the report to app/.
      - run: composer test:coverage

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Reverb host and port from .env.example are baked into the bundle.
      - name: Prepare environment and build frontend assets
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts Reverb and the app on a fresh database/e2e.sqlite (playwright.config.js).
      - run: npm run test:e2e

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            storage/framework/testing/e2e-results/
          retention-days: 7
